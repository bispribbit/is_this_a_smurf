[workspace]
members = ["crates/*"]

# Resolver needs to be set for workspaces
# https://doc.rust-lang.org/edition-guide/rust-2021/default-cargo-resolver.html
resolver = "3"

[workspace.package]
# Default license and edition
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal workspace dependencies
config = { path = "crates/config" }
database = { path = "crates/database" }
replay_parser = { path = "crates/replay_parser" }
feature_extractor = { path = "crates/feature_extractor" }
skill_model = { path = "crates/skill_model" }
replay_structs = { path = "crates/replay_structs" }

# External workspace dependencies
anyhow = { version = "1.0.104" }
boxcars = { version = "0.12.0" }
brotli = { version = "9.0.0" }
brotli-decompressor = { version = "6.0.1" }
bytes = { version = "1.12.1" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = { version = "1.4.0" }
dioxus = { version = "0.7.10" }
dotenvy = { version = "0.15.7" }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# Transitive getrandom 0.3 from rand/burn: enable wasm_js when building is_this_a_smurf for wasm32-unknown-unknown
getrandom_for_transitive_rand = { package = "getrandom", version = "0.3.4", default-features = false, features = [
    "wasm_js",
] }
governor = { version = "0.10.4" }
js-sys = { version = "0.3.106" }
manganis = { version = "0.7.10", default-features = false, features = [
    "dioxus",
] }
object_store = { version = "0.14.2" }
rayon = { version = "1.12.0" }
rand = { version = "0.10.3", default-features = false, features = [
    "std",
    "thread_rng",
] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8" }
uuid = { version = "1.27.0", features = ["v4", "js"] }
wasm-bindgen = { version = "0.2.129" }
wasm-bindgen-futures = { version = "0.4.79" }
web-sys = { version = "0.3.106" }

# Profile used by the Dioxus CLI (`dx build --release`) for the wasm web build.
# Defining it explicitly (instead of letting `dx` synthesize a default) lets us
# strip DWARF debug info at link time. The debug info is what makes `wasm-opt`
# abort with "compile unit size was incorrect (unsupported version of DWARF)",
# and skipping `wasm-opt` is what leaves the bundle oversized.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
# Not `true`: on wasm that also strips the custom section wasm-bindgen reads.
strip = "debuginfo"
panic = "abort"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

tail_expr_drop_order = { level = "allow" } # Warns on all significant drop

elided_lifetimes_in_paths = "allow"
unsafe_code = "deny"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }

# Nursery exception in allow list below 
cognitive_complexity = "allow" # Doesn't work well in practice

# Clippy pedantic lints, treat all as warnings by default
pedantic = { level = "warn", priority = -1 }

# Pedentic exceptions in allow list below
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
if_not_else = "allow"
option_if_let_else = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
shadow_unrelated = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
unseparated_literal_suffix = "allow"

# Normal are often triggered in bevy
type_complexity = "allow"

# Restriction lints
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
bool_to_int_with_if = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
empty_drop = "warn"
empty_line_after_doc_comments = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
fallible_impl_from = "warn"
float_cmp_const = "warn"
format_push_string = "warn"
indexing_slicing = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
let_underscore_untyped = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_enforced_import_renames = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
string_slice = "warn"
tests_outside_test_module = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
